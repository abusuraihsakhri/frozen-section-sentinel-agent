name: Test and validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Compile Python source
        run: python -m compileall -q agents frozen_section_sentinel_agent cli.py enrichment.py frozen_sentinel.py
      - name: Execute Python tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          python cli.py audit --task-id SYNTH-CI --target SYNTH-SPECIMEN --primary 5 --secondary 1 --status NOMINAL
          python -m frozen_section_sentinel_agent.cli audit --case-id SYNTH-CI --primary 5 --secondary 1 --status NORMAL
      - name: Verify default audit ledger
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: node --check web/app.js
      - name: Browser rule contract tests
        run: node --test tests/web_app.test.cjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependency auditor
        run: python -m pip install pip-audit
      - name: Audit declared runtime dependencies
        run: |
          python - <<'PY'
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          requirements = project["dependencies"] + project["optional-dependencies"]["server"]
          Path("audit-requirements.txt").write_text("\n".join(requirements) + "\n", encoding="utf-8")
          PY
          python -m pip_audit --strict -r audit-requirements.txt

  pages-smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Check published Pages entry and browser script
        env:
          SITE_URL: https://abusuraihsakhri.github.io/frozen-section-sentinel-agent
        run: |
          for attempt in {1..24}; do
            if curl --fail --silent --show-error --location "$SITE_URL/" | grep -q 'web/' \
               && curl --fail --silent --show-error --location "$SITE_URL/web/" | grep -q 'Frozen Section Sentinel' \
               && curl --fail --silent --show-error --location "$SITE_URL/web/app.js" | grep -q 'LOCAL_DEMONSTRATION'; then
              echo "Pages entry, HTML, and JavaScript confirmed"
              exit 0
            fi
            sleep 5
          done
          echo "::error::GitHub Pages entry or browser assets could not be confirmed"
          exit 1
