name: Test and validate

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[server,test]"
      - name: Compile Python source
        run: python -m compileall -q agents frozen_section_sentinel_agent cli.py enrichment.py frozen_sentinel.py
      - name: Execute Python tests
        run: python -m pytest -q
      - name: CLI smoke tests
        run: |
          python cli.py audit --task-id SYNTH-CI --target SYNTH-SPECIMEN --primary 5 --secondary 1 --status NOMINAL
          python -m frozen_section_sentinel_agent.cli audit --case-id SYNTH-CI --primary 5 --secondary 1 --status NORMAL
      - name: Verify default audit ledger
        run: python -c "from agents.base import AuditLogger; assert AuditLogger.verify_integrity()"

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JavaScript syntax check
        run: node --check web/app.js
      - name: Browser rule contract tests
        run: node --test tests/web_app.test.cjs

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install runtime dependencies and auditor
        run: |
          python -m pip install -e ".[server]"
          python -m pip install pip-audit
      - name: Audit installed dependencies
        run: python -m pip_audit --strict --skip-editable
